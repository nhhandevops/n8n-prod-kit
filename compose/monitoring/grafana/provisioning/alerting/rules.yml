# compose/monitoring/grafana/provisioning/alerting/rules.yml — Grafana-managed alert rules of the kit (S6).
# GENERATED (scratch generator kept with the session notes); edit consistently, then check with smoke 09 + make doctor.
# Evaluated every 30 s in the folder "n8n-kit"; notifications go to the Telegram contact point that render.sh writes into
# notifications.yml when ALERT_TELEGRAM_BOT_TOKEN + ALERT_TELEGRAM_CHAT_ID are set (otherwise they only show in
# Grafana -> Alerting). Grafana does NOT expand environment variables in rule files — neither in the queries nor in the
# annotations (verified in CI 2026-10-08) — so nothing here depends on the environment: this kit's Compose project is
# found as "the project that has an n8n-main container", and alert templates use plain $values / $labels.
# Shape of every rule: A = an instant PromQL query, C = a threshold on A (one alert instance per returned series).
apiVersion: 1

groups:
  - orgId: 1
    name: n8n-kit
    folder: n8n-kit
    interval: 30s
    rules:
      - uid: kit-n8n-ui-down
        title: N8nUIDown
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'n8n-main (editor, API, triggers) is down'
          description: >-
            Prometheus has not reached n8n-main for 2 minutes: the UI, the API and every schedule/poll trigger are
            stopped. make status; make logs SERVICE=n8n-main SINCE=15m
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(up{job="n8n-main"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-webhook-pool-down
        title: WebhookPoolDown
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'No webhook processor is up - production webhooks fail'
          description: >-
            Every n8n-webhook process is unreachable: production webhooks, forms and MCP calls get 502. make status; make
            logs SERVICE=n8n-webhook-1
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(up{job="n8n-webhook"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-webhook-processor-missing
        title: WebhookProcessorMissing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} webhook processor(s) down for 5 minutes'
          description: >-
            Production webhooks still work through the remaining processor(s), but without redundancy. make status; make
            logs SERVICE=n8n-webhook-1
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(count(up{job="n8n-webhook"} == 0) or vector(0)) and on() (sum(up{job="n8n-webhook"}) >= 1)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: kit-worker-pool-down
        title: WorkerPoolDown
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'No n8n worker is up - no execution runs'
          description: >-
            Every n8n worker is unreachable: queued executions wait until one comes back (with WORKER_REPLICAS=1 this is
            the only worker). make status; make logs SERVICE=n8n-worker-1 SINCE=15m
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(up{job="n8n-worker"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-worker-missing
        title: WorkerMissing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} n8n worker(s) down for 5 minutes'
          description: >-
            Some workers are down: executions run on the remaining ones with reduced capacity (all down = WorkerPoolDown).
            make status; make logs SERVICE=n8n-worker-1
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(count(up{job="n8n-worker"} == 0) or vector(0)) and on() (sum(up{job="n8n-worker"}) >= 1)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: kit-service-unhealthy
        title: KitServiceUnhealthy
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.container_label_com_docker_compose_service }} has been unhealthy for 5 minutes'
          description: >-
            Its Docker healthcheck fails (for n8n: /healthz/readiness, which needs the database and Valkey). Postgres or
            Valkey down shows up here first: n8n keeps answering /metrics without them. make status; make doctor
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                min by (container_label_com_docker_compose_service)
                (abs(container_health_state{container_label_com_docker_compose_service=~"postgres|valkey|caddy|backup|n8n-.+"})
                and on(container_label_com_docker_compose_project) count by (container_label_com_docker_compose_project)
                (container_health_state{container_label_com_docker_compose_service="n8n-main"}))
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-queue-backlog
        title: QueueBacklog
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} executions waiting in the queue'
          description: >-
            More than 500 jobs have been waiting for 5 minutes: too few workers, or stuck ones. make scale-workers N=...;
            check the worker logs and Valkey memory (make doctor)
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(n8n_scaling_mode_queue_jobs_waiting)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [500]
      - uid: kit-execution-failure-rate
        title: ExecutionFailureRate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'More than 10 % of executions failed over 15 minutes (for 5 minutes)'
          description: >-
            Failed / all production executions over 15 minutes, only when at least 5 ran (editor test runs are not
            counted). n8n UI: Executions, filter by status Error
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (((sum(increase(n8n_workflow_execution_duration_seconds_count{status!="success",mode!~"manual|evaluation|integrated"}[15m])
                and n8n_workflow_execution_duration_seconds_count{status!="success",mode!~"manual|evaluation|integrated"}
                offset 15m) or vector(0)) +
                (sum((n8n_workflow_execution_duration_seconds_count{status!="success",mode!~"manual|evaluation|integrated"}
                unless n8n_workflow_execution_duration_seconds_count{status!="success",mode!~"manual|evaluation|integrated"}
                offset 15m) and on(instance) (up offset 15m == 1)) or vector(0))) /
                clamp_min(((sum(increase(n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"}[15m])
                and n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"} offset 15m) or
                vector(0)) + (sum((n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"} unless
                n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"} offset 15m) and
                on(instance) (up offset 15m == 1)) or vector(0))), 1)) and on()
                (((sum(increase(n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"}[15m]) and
                n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"} offset 15m) or vector(0))
                + (sum((n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"} unless
                n8n_workflow_execution_duration_seconds_count{mode!~"manual|evaluation|integrated"} offset 15m) and
                on(instance) (up offset 15m == 1)) or vector(0))) >= 5)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
      - uid: kit-backup-missing
        title: BackupMissing
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'No successful backup for {{ with $values.A }}{{ printf "%.1f" .Value }}{{ end }} hours on at least one target'
          description: >-
            The oldest last-success over BACKUP_REMOTES is older than 26 h; the clock starts when backups were switched
            on, and a target that never succeeded counts as never. Quiet while BACKUP_ENABLED is false. make logs
            SERVICE=backup SINCE=48h; make backup-now; make doctor
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                ((time() - (min(backup_last_success_timestamp_seconds or on(remote) (backup_last_status * 0)) or on()
                max(backup_schedule_enabled_since_timestamp_seconds))) / 3600) * on() max(backup_schedule_enabled)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [26]
      - uid: kit-backup-attempt-failed
        title: BackupLastAttemptFailed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'The last backup attempt failed on at least one target'
          description: >-
            The backup service alerts directly too; this fires until the next successful backup. make logs SERVICE=backup;
            make backup-now
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'min(backup_last_status)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-restore-test-failed
        title: RestoreTestFailed
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'The last restore test FAILED'
          description: >-
            A backup that does not restore is not a backup. make restore-test shows why (report: /state/restore-test.json
            in the backup service)
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'min(restore_test_last_status)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-restore-test-stale
        title: RestoreTestStale
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'No passing restore test for {{ with $values.A }}{{ printf "%.1f" .Value }}{{ end }} days'
          description: >-
            The weekly restore test (RESTORE_TEST_SCHEDULE) has not passed for more than 8 days (counted from when backups
            were switched on). make restore-test
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                ((time() - (max(restore_test_last_success_timestamp_seconds) or on()
                max(backup_schedule_enabled_since_timestamp_seconds))) / 86400) * on() max(backup_schedule_enabled)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [8]
      - uid: kit-disk-high
        title: DiskHigh
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} {{ with $values.A }}{{ humanizePercentage .Value }}{{ end }} full'
          description: >-
            Above 80 %: Docker logs, the database and local backups live on the host's disks. docker system df; prune
            executions (EXECUTIONS_DATA_MAX_AGE); keep backups off-host
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                max by (mountpoint) (1 -
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|iso9660|fuse.*",mountpoint!~"/boot.*"} /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|iso9660|fuse.*",mountpoint!~"/boot.*"}) unless
                on(mountpoint) (max by (mountpoint)
                (node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs|nsfs|iso9660|fuse.*",mountpoint!~"/boot.*"}) == 1)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
      - uid: kit-cert-expiring
        title: CertExpiring
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate expires in {{ with $values.A }}{{ printf "%.1f" .Value }}{{ end }} days'
          description: >-
            Caddy renews 30 days ahead, so renewal keeps failing: make logs SERVICE=caddy SINCE=24h (DNS, port 80, ACME
            rate limits)
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(min(cert_expiry_timestamp_seconds) - time()) / 86400'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [14]
      - uid: kit-cert-check-failing
        title: CertCheckFailing
        condition: C
        for: 2h30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'The hourly certificate check cannot read the certificate Caddy serves'
          description: >-
            Three hourly cert-checks in a row failed, so CertExpiring is blind. make logs SERVICE=backup; make logs
            SERVICE=caddy SINCE=3h
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'min(cert_check_success)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: kit-container-restarting
        title: ContainerRestarting
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'A container of this kit restarted more than twice in 15 minutes'
          description: >-
            Crash loop in this kit's Compose project: make status shows which one; make logs SERVICE=NAME SINCE=15m
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                max by (container_label_com_docker_compose_project)
                (changes(container_start_time_seconds{container_label_com_docker_compose_project!=""}[15m])) and
                on(container_label_com_docker_compose_project) count by (container_label_com_docker_compose_project)
                (container_health_state{container_label_com_docker_compose_service="n8n-main"})
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
      - uid: kit-monitoring-target-down
        title: MonitoringTargetDown
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} monitoring target(s) down'
          description: >-
            Caddy metrics, node-exporter, cAdvisor, Loki, Alloy or Grafana cannot be scraped: dashboards and alerts that
            depend on them go blind. make status
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(up{job=~"caddy|node|cadvisor|loki|alloy|grafana"} == 0) or vector(0)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
