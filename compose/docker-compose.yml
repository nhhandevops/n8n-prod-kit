# n8n Production Kit — Compose core (session S2).
#
# Topology:
#   caddy            the ONLY published service: HTTP_PORT/HTTPS_PORT (+ HTTPS_PORT/udp for HTTP/3); terminates TLS (ACME or internal CA),
#                    sends UI/API/test-webhooks to n8n-main and production webhooks round-robin to the n8n-webhook pool; health-checks them itself.
#   n8n-main         editor UI, REST API, triggers/schedules, DB migrations; manual runs are offloaded to the workers (so main has NO runner sidecar).
#   n8n-webhook-1/2  stateless production-webhook receivers: they only enqueue jobs and never execute code (no runners either).
#   n8n-worker-1/2   execute every queued job; each has a 1:1 n8nio/runners sidecar (n8n-worker-N-runners) that sandboxes Code-node tasks.
#   postgres, valkey state (PostgreSQL 18) and queue/broker (Bull on Valkey); unpublished, reachable only on the backend network.
#
# How to run it: ALWAYS through `make …` or scripts/lib.sh (`compose "$@"`), which pass
#   --project-directory compose/ --env-file versions.env --env-file .env -f docker-compose.yml [-f compose.dev.yml when TLS_MODE=internal]
# `versions.env` (pins, rewritten by `make pin`) is loaded FIRST and `.env` (site settings + secrets, written by `make init`) overrides it.
# There is deliberately no top-level `name:` here: the project name comes from COMPOSE_PROJECT_NAME in .env (contract §2), so a second
# copy of the kit on the same host only needs a different .env. Never hard-code container names — use service names (Compose DNS).
#
# Every image reference is `<image>:<tag>@<digest>`; the `${X_DIGEST:?run make pin}` guard makes `compose config` fail with that exact
# message instead of silently pulling a floating tag when versions.env is incomplete.
#
# Every container has a read-only root filesystem. For the five n8n processes the write set outside their two volumes was
# measured with `docker diff` after a real workload (S3): main writes its compiled editor assets to /home/node/.cache, every
# role writes temp files to /tmp (n8nDataTableUploads), and community-node installs use npm's cache in /home/node/.npm — those
# three paths are tmpfs; everything else is the n8n_data / n8n_files volumes. (caddy, postgres, valkey and the runners sidecars
# have their own verified tmpfs/volume layout.)
#
# Hardening that IS in place on every service: `restart: unless-stopped`, `no-new-privileges`, `cap_drop: [ALL]` (caddy re-adds the one
# capability its binary carries as a file capability), a memory limit from .env (MEM_LIMIT_*), json-file logs capped at 20 MB x 5, a
# healthcheck with a start_period long enough for the observed cold start, and `depends_on … service_healthy` ordering (postgres/valkey →
# main → webhooks/workers → runners) so migrations run exactly once, on main, before anything else connects.
#
# Networks: `internal` is the backend network (every service) and IS `internal: true` — a container attached only to it has no route
# out at all (verified: no default route, cannot reach 1.1.1.1 or host-gateway), which is exactly the isolation postgres, valkey and the
# runners sidecars should have. `proxy` is the routable bridge: caddy (edge) plus every n8n process that must reach the Internet —
# main and the webhook pool (Caddy's upstreams) AND the workers, because HTTP Request / API nodes execute on workers. The runners
# stay internal-only: Code-node network calls go through the worker's helpers, not the sandbox (S3 re-checks this with a real workflow).
#
# YAML anchors (`x-*` blocks, echoed harmlessly by `compose config`): `<<:` merges are SHALLOW — a service that declares its own
# `environment:` would REPLACE a merged one. Hence TWO anchors per role: `*n8n-base` merged at service level (image, networks, volumes,
# logging, security, restart) and `*n8n-env` merged INSIDE `environment:` so each service can add its own keys on top. Likewise
# `*runners-base` / `*runners-env`. Keys a service re-declares at service level (networks, tmpfs, …) override the base — intentionally.

x-logging: &logging
  # 20 MB x 5 files per container ≈ 100 MB worst case each, ~1 GB for the stack; enough history for `make logs SINCE=…` without ever filling
  # the disk. json-file keeps `docker logs` and the S6 log shipper working; n8n itself logs JSON lines (N8N_LOG_FORMAT=json below).
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# ----------------------------------------------------------------------------------------------------------------------------------------
# n8n (main / webhook / worker) — service-level base. Everything here is identical for the five n8n processes.
# ----------------------------------------------------------------------------------------------------------------------------------------
x-n8n-base: &n8n-base
  image: ${N8N_IMAGE}:${N8N_VERSION}@${N8N_DIGEST:?run make pin}
  # unless-stopped (not on-failure): survives host reboots and keeps retrying after a DB/Redis outage; `make down` still stops it for good.
  restart: unless-stopped
  # N8N_GRACEFUL_SHUTDOWN_TIMEOUT (default 30 s, .env) is how long n8n waits for running executions on SIGTERM; Compose's default
  # grace is 10 s, which would SIGKILL mid-execution. 40 s = n8n's budget + margin. Raise both together if you raise the .env knob.
  stop_grace_period: 40s
  # The image already runs as uid 1000 (`node`); no `user:` override, so the shared volumes keep one consistent owner.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # read-only rootfs; the three tmpfs mounts are the measured write set (see the header). Node's /tmp usage includes the
  # data-table upload staging dir; ~/.cache holds the editor bundle main compiles at start; ~/.npm is npm's cache for
  # community-node installs (the packages themselves land in the n8n_data volume under nodes/).
  # uid/gid/mode are REQUIRED on the two dirs that do not exist in the image: Docker mounts such a tmpfs 1777 on the
  # first start but root:root 0755 after a container RESTART (verified on Docker 29.5) — n8n-main then dies with
  # "EACCES mkdir /home/node/.cache/n8n" on every restart, reboot or `make restore`.
  read_only: true
  tmpfs:
    - /tmp
    - /home/node/.cache:uid=1000,gid=1000,mode=0700
    - /home/node/.npm:uid=1000,gid=1000,mode=0700
  logging: *logging
  networks:
    - internal
  volumes:
    # n8n_data: /home/node/.n8n — `config` (encryption-key file, mode 0600, enforced), community nodes, event log, storage. Shared by all
    # five processes so that every instance sees the same community nodes and settings (the encryption key itself comes from .env).
    - n8n_data:/home/node/.n8n
    # n8n_files: /home/node/.n8n-files — the 2.x default N8N_RESTRICT_FILE_ACCESS_TO location, i.e. the only tree the Read/Write Files
    # node may touch. A dedicated volume keeps user files out of the config tree that N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES protects.
    - n8n_files:/home/node/.n8n-files

# ----------------------------------------------------------------------------------------------------------------------------------------
# n8n — shared environment map. Every variable NAME below was checked against the list extracted from the 2.42 image (contract §1).
# Values in `${X:-default}` form are site knobs from .env (defaults = n8n's own or the kit's opinionated ones, see .env.example);
# `${X:?…}` are secrets/identity that `make init` must have written — Compose refuses to start without them rather than booting a
# half-configured stack (e.g. a worker without the encryption key cannot decrypt a single credential).
# ----------------------------------------------------------------------------------------------------------------------------------------
x-n8n-env: &n8n-env
  # --- database: all five processes share one PostgreSQL ---
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (make init)}
  # 4 connections per process (n8n default 2): 5 processes x 4 = 20, up to 16 workers = 76, well under postgres max_connections=150.
  DB_POSTGRESDB_POOL_SIZE: "4"
  # --- queue mode: Bull on Valkey is the job broker between main/webhooks (producers) and workers (consumers) ---
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: valkey
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD (make init)}
  QUEUE_BULL_REDIS_DB: "0"
  # key prefix (n8n default "bull"): namespaces the kit's keys so a shared Valkey could host something else later.
  QUEUE_BULL_PREFIX: n8n
  # --- credentials encryption: MUST be identical on main, webhooks and workers; main/webhook would silently auto-generate one if unset ---
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY (make init)}
  # filesystem binary mode is UNSUPPORTED in queue mode (docs); `database` is the licence-free queue-mode default — set explicitly so the
  # deprecated in-memory `default` mode can never be selected. S3/Azure need a paid licence.
  N8N_DEFAULT_BINARY_DATA_MODE: database
  # --- task runners: external mode = the separate n8nio/runners sidecars (internal mode is deprecated and cannot run Python) ---
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN (make init)}
  # the task broker (port 5679 on each worker) listens on 127.0.0.1 by default — unreachable from a sidecar container.
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  # broker-side task timeout; the same value is given to the sidecars (whose launcher would otherwise force 60 s).
  N8N_RUNNERS_TASK_TIMEOUT: ${RUNNERS_TASK_TIMEOUT:-300}
  # --- public identity behind the reverse proxy ---
  N8N_HOST: ${DOMAIN:?set DOMAIN}
  N8N_PROTOCOL: https
  N8N_PORT: "5678"
  # N8N_WEBHOOK_URL (not the deprecated WEBHOOK_URL alias) sets the base of production AND test webhook URLs; PUBLIC_URL is written by
  # `make init` as https://DOMAIN/ or https://DOMAIN:HTTPS_PORT/ so dev hosts on 8443 get correct links too.
  N8N_WEBHOOK_URL: ${PUBLIC_URL:?set PUBLIC_URL (make init)}
  N8N_EDITOR_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL (make init)}
  # exactly one proxy (Caddy) in front: trust its X-Forwarded-* so client IPs and the https scheme are seen correctly.
  N8N_PROXY_HOPS: "1"
  N8N_SECURE_COOKIE: "true"
  N8N_SAMESITE_COOKIE: lax
  # --- logging: JSON lines to stdout so `docker logs`, Loki/Promtail (S6) and grep all see structured records; 'json' is the exact value ---
  N8N_LOG_LEVEL: info
  N8N_LOG_OUTPUT: console
  N8N_LOG_FORMAT: json
  # --- metrics: /metrics on every process (main additionally publishes the Bull queue gauges); scraped by Prometheus in S6 ---
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
  N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
  N8N_METRICS_QUEUE_METRICS_INTERVAL: "20"
  # --- site knobs from .env (group 1/4/5 of .env.example); names verified, defaults mirror .env.example ---
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
  # -1 = use the worker's --concurrency flag; any other value overrides it on every worker.
  N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_CONCURRENCY_PRODUCTION_LIMIT:--1}
  EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
  EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-10000}
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
  EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
  EXECUTIONS_DATA_SAVE_ON_PROGRESS: ${EXECUTIONS_DATA_SAVE_ON_PROGRESS:-false}
  EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: ${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-true}
  EXECUTIONS_TIMEOUT: ${EXECUTIONS_TIMEOUT:--1}
  EXECUTIONS_TIMEOUT_MAX: ${EXECUTIONS_TIMEOUT_MAX:-3600}
  # security (2.x defaults made explicit so a future default change cannot silently loosen the kit)
  N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
  N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: ${N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES:-true}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
  N8N_GIT_NODE_DISABLE_BARE_REPOS: ${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}
  # telemetry/UI noise off, templates and version notices on (see .env.example for the rationale of each)
  N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
  N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
  N8N_HIRING_BANNER_ENABLED: ${N8N_HIRING_BANNER_ENABLED:-false}
  N8N_TEMPLATES_ENABLED: ${N8N_TEMPLATES_ENABLED:-true}
  N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-true}
  N8N_PUBLIC_API_DISABLED: ${N8N_PUBLIC_API_DISABLED:-false}
  # community packages that n8n has not verified: off (the 3.0 default; 2.42 warns at startup that the default will change)
  N8N_UNVERIFIED_PACKAGES_ENABLED: ${N8N_UNVERIFIED_PACKAGES_ENABLED:-false}
  # Community packages live in the n8n_data volume, which backups do not carry: after a restore onto a new host n8n
  # reinstalls every package the restored database lists (n8n's default false would leave those nodes "unrecognized").
  N8N_REINSTALL_MISSING_PACKAGES: "true"
  # setting NODES_EXCLUDE REPLACES n8n's default list, so the two dangerous nodes it disables by default are repeated here.
  NODES_EXCLUDE: '${NODES_EXCLUDE:-["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]}'

# ----------------------------------------------------------------------------------------------------------------------------------------
# runners sidecars — service-level base (one sidecar per worker; main offloads manual runs, webhooks never execute code).
# ----------------------------------------------------------------------------------------------------------------------------------------
x-runners-base: &runners-base
  # same N8N_VERSION as n8n on purpose: the runners image MUST match the n8n version (docs); only the digest is its own.
  image: ${RUNNERS_IMAGE}:${N8N_VERSION}@${RUNNERS_DIGEST:?run make pin}
  # The launcher takes runner types as positional args; the string form is split by Compose into argv, so RUNNERS_LANGS="javascript python"
  # enables the Python runner as well (there is no env var for that — N8N_NATIVE_PYTHON_RUNNER does not exist in 2.42).
  command: ${RUNNERS_LANGS:-javascript}
  # unless-stopped MATTERS here: with a wrong token the launcher stays silent for 60 s and then exits 0 — `on-failure` would never
  # restart it, so the symptom would be "Code nodes hang" instead of a visible restart loop.
  restart: unless-stopped
  # the launcher drains for N8N_RUNNERS_LAUNCHER_GRACEFUL_SHUTDOWN_TIMEOUT (10 s below; its default is 50 s) before exiting → 15 s grace.
  stop_grace_period: 15s
  # runs user code: read-only rootfs + private /tmp, image default user `runner` (uid 1000), no capabilities, no volumes.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging
  networks:
    - internal
  healthcheck:
    # LIVENESS only: the launcher answers 200 on 5680 even while the broker is unreachable or the token is wrong (verified) — it proves the
    # process is alive, nothing more. Never probe 5681/5682: runner processes only exist while a task runs. busybox wget, no curl in the image.
    test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:5680/healthz | grep -q ok"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  deploy:
    resources:
      limits:
        # idle ≈ 3 MiB; budget ≈ 200 MiB per concurrently running JS runner, +75 MiB for Python — size with RUNNERS_MAX_CONCURRENCY.
        memory: ${MEM_LIMIT_RUNNERS:-512m}

x-runners-env: &runners-env
  # the launcher refuses to start without the token (exit 1); it must equal the broker's N8N_RUNNERS_AUTH_TOKEN above.
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN (make init)}
  # seconds of idleness before a runner process exits (the launcher re-spawns one on the next task); 0 would keep ~200 MiB resident.
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
  # forwarded to the runner processes (allowed-env); JS default would be 10, Python 5.
  N8N_RUNNERS_MAX_CONCURRENCY: ${RUNNERS_MAX_CONCURRENCY:-5}
  # the launcher otherwise FORCES 60 s into the runners regardless of the broker's 300 s — long Code nodes would die at 60 s.
  N8N_RUNNERS_TASK_TIMEOUT: ${RUNNERS_TASK_TIMEOUT:-300}
  # drain window on SIGTERM (launcher default 50 s would be SIGKILLed by any sane stop_grace_period).
  N8N_RUNNERS_LAUNCHER_GRACEFUL_SHUTDOWN_TIMEOUT: "10"
  # one of the few variables the launcher forwards to runners: Date/luxon inside Code nodes use it.
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}

services:
  # ======================================================================================================================================
  # caddy — edge: TLS, routing, the only published ports
  # ======================================================================================================================================
  caddy:
    image: ${CADDY_IMAGE}:${CADDY_VERSION}@${CADDY_DIGEST:?run make pin}
    restart: unless-stopped
    # Non-root on purpose (verified): the internal CA it writes under /data is then owned by uid 1000, i.e. readable by n8n (uid 1000)
    # through compose.dev.yml's read-only mount — root-owned PKI (mode 0700) would be invisible to n8n. The image ships /data/caddy and
    # /config/caddy world-writable (1777) with no VOLUME, so fresh named volumes let uid 1000 create everything it needs.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # MANDATORY even though Docker allows unprivileged low ports: /usr/bin/caddy carries the file capability cap_net_bind_service=ep and
      # exec() of such a binary fails with "operation not permitted" when that capability is missing from the bounding set (verified).
      - NET_BIND_SERVICE
    ports:
      # host port == container port on purpose: the Caddyfile listens on {$HTTP_PORT}/{$HTTPS_PORT} too, so the http→https redirect and
      # Alt-Svc advertise the port a browser can actually reach (Caddy strips the request port and appends only its own https_port ≠ 443).
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      # HTTP/3 (QUIC); without it browsers simply fall back to h2, with it the Alt-Svc header Caddy already sends becomes true.
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    environment:
      # Caddyfile placeholders ({$VAR} / {$VAR:default}); contract §9 lists this exact set. DOMAIN and ACME_EMAIL are hard requirements
      # even with tls internal (`caddy validate` fails without them), hence `:?`.
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      TLS_MODE: ${TLS_MODE:-acme}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      UI_PROTECT: ${UI_PROTECT:-off}
      # Caddy applies a {$VAR:default} only when VAR is UNSET — a set-but-empty value (what .env.example ships: UI_ALLOW_CIDR=) yields an
      # empty matcher argument (verified on the build VM). So the "allow everyone" default is applied here, where empty counts as unset.
      UI_ALLOW_CIDR: "${UI_ALLOW_CIDR:-0.0.0.0/0 ::/0}"
      UI_BASIC_AUTH_USER: ${UI_BASIC_AUTH_USER:-}
      # bcrypt hash from `caddy hash-password`; must be single-quoted in .env or Compose eats the `$…` segments (verified).
      UI_BASIC_AUTH_HASH: ${UI_BASIC_AUTH_HASH:-}
      # the webhook pool; static in S2 (two webhook processes are static services). Space-separated → N upstreams in the Caddyfile.
      WEBHOOK_UPSTREAMS: n8n-webhook-1:5678 n8n-webhook-2:5678
      KUMA_ENABLED: ${KUMA_ENABLED:-off}
    volumes:
      # /data: certificates, ACME account, internal PKI — losing it means re-issuing (and hitting Let's Encrypt rate limits).
      - caddy_data:/data
      # /config: Caddy's autosaved last-good config.
      - caddy_config:/config
      # the Caddyfile and its snippet files, read-only; `:z` relabels for SELinux hosts (no-op elsewhere, verified).
      - ./caddy:/etc/caddy:ro,z
    # edge-grafana / edge-kuma: one private link each to Grafana and Uptime Kuma (monitoring profile), so neither shares a
    # network with the n8n workers (whose workflows can call anything on their networks)
    networks:
      - proxy
      - internal
      - edge-grafana
      - edge-kuma
    healthcheck:
      # the admin API on loopback. 127.0.0.1, NEVER `localhost`: busybox resolves localhost to ::1 while Caddy's admin listens on
      # 127.0.0.1 only (verified). Port 2019 is not published — the config it returns contains the basic-auth hash.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No depends_on: Caddy health-checks its upstreams itself and serves 502s until n8n is ready, which is exactly what we want during a
    # 60-120 s n8n cold start; `make up` with TLS_MODE=internal even starts it first to export the dev CA.
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_CADDY:-256m}

  # ======================================================================================================================================
  # postgres — the database (PostgreSQL 18)
  # ======================================================================================================================================
  postgres:
    image: ${POSTGRES_IMAGE}:${POSTGRES_VERSION}@${POSTGRES_DIGEST:?run make pin}
    # shared_buffers 256 MB for a ~1 GB container; max_connections 150 covers up to 16 workers x pool 4 plus admins; statements slower
    # than 2 s are logged (slow-query visibility without pg_stat_statements). PG18 enables data checksums by default — no INITDB_ARGS.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=150", "-c", "log_min_duration_statement=2000"]
    # uid/gid of `postgres` in the alpine image (verified); with an explicit user the entrypoint skips chown/gosu and initdb runs directly.
    user: "70:70"
    read_only: true
    tmpfs:
      # the unix socket dir (/var/run → /run symlink in the image) and temp files are the only writes outside the data volume (verified).
      - /var/run/postgresql
      - /tmp
    restart: unless-stopped
    # SIGINT = fast shutdown (image StopSignal); 30 s lets a checkpoint finish instead of forcing crash recovery on the next start.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (make init)}
    volumes:
      # PG18 moved the volume to /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker): mounting the parent keeps future
      # major-version upgrades (pg_upgrade needs old and new cluster side by side) inside one volume.
      - pg_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      # TCP probe on purpose: during first-boot initdb the entrypoint's temporary server answers the unix-socket probe ~2 s before the real
      # server listens, which would release depends_on too early; the TCP probe only succeeds once the final server binds 0.0.0.0:5432.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "n8n", "-d", "n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_POSTGRES:-1g}

  # ======================================================================================================================================
  # valkey — the queue broker (Redis-compatible)
  # ======================================================================================================================================
  valkey:
    image: ${VALKEY_IMAGE}:${VALKEY_VERSION}@${VALKEY_DIGEST:?run make pin}
    # SHELL form on purpose: in exec form Compose's `$$VAR` reaches the process unexpanded and the LITERAL string "$VALKEY_PASSWORD" becomes
    # the password (verified). `sh -c` expands it at start-up and `exec` makes valkey-server PID 1's child directly, so docker inspect and
    # `ps` show only the variable name, never the value.
    #   --appendonly yes / everysec : durable queue (Bull jobs survive a restart, at most 1 s lost)
    #   --maxmemory 256mb + noeviction : a full broker must ERROR, not silently drop jobs (Bull cannot survive evicted keys)
    #   --save ''                   : no RDB snapshots on top of AOF (less I/O, one persistence mechanism)
    # (block-folded `>-` so the single shell string stays under the 160-column lint limit; `$$` is Compose's escape for a literal `$`)
    command:
      - sh
      - -c
      - >-
        exec valkey-server --requirepass "$$VALKEY_PASSWORD"
        --appendonly yes --appendfsync everysec
        --maxmemory 256mb --maxmemory-policy noeviction
        --save ''
    # uid 999 / gid 1000 = valkey:valkey in THIS image (not 999:999 — gid 999 is Alpine's `ping` group; verified).
    user: "999:1000"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD (make init)}
    volumes:
      # the image declares no VOLUME; with read_only the AOF directory needs this explicit volume (verified).
      - valkey_data:/data
    networks:
      - internal
    healthcheck:
      # `valkey-cli ping` exits 0 even on NOAUTH/WRONGPASS (verified), so authenticate via VALKEYCLI_AUTH and require the literal PONG.
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=$$VALKEY_PASSWORD valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    deploy:
      resources:
        limits:
          # maxmemory 256 MB + AOF rewrite buffers + allocator overhead; vm.overcommit_memory=1 on the host silences Valkey's warning.
          memory: ${MEM_LIMIT_VALKEY:-384m}

  # ======================================================================================================================================
  # n8n-main — UI, API, triggers, migrations. Runs NO production webhooks and NO executions itself.
  # ======================================================================================================================================
  n8n-main:
    <<: *n8n-base
    # default command (`n8n` = start). Reached by Caddy on the proxy network; talks to the backend on internal.
    networks:
      - proxy
      - internal
    environment:
      <<: *n8n-env
      # manual (editor "Test workflow") runs go to the workers too: main then starts NO task broker/runner (verified) and stays responsive.
      # Value must be the literal string "true". Becomes the only behaviour in n8n 3.0.
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      # main stops mounting /webhook, /form, /webhook-waiting, /mcp: production traffic belongs to the webhook pool only. Caddy routes those
      # paths explicitly; a misroute to main would otherwise fall through to the SPA with HTTP 200 (verified), so this is belt AND braces.
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"
      # shared ~/.n8n volume → give every process its own event-log file name (name verified in the image's env list).
      N8N_EVENTBUS_LOGWRITER_LOGBASENAME: eventlog-n8n-main
    healthcheck:
      # readiness (DB connected + migrated + server fully up), not plain /healthz: webhooks/workers wait on this, so it must mean "migrated".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      # ≈ 51 s observed on a loaded VM including ~150 migrations on a fresh DB; a major upgrade can take longer → generous 120 s.
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_MAIN:-1g}

  # ======================================================================================================================================
  # n8n-webhook-1/2 — production webhook receivers (the Caddy pool). Identical except for the event-log name.
  # ======================================================================================================================================
  n8n-webhook-1:
    <<: *n8n-base
    command: ["webhook"]
    networks:
      - proxy
      - internal
    environment:
      <<: *n8n-env
      # Response relay (≥ 2.34): bodies above SIZE_MAX MiB are stored in binary-data storage instead of failing the node. The flag is READ
      # ON THE WORKERS (they produce the response); it is repeated here so every instance carries the same relay settings (docs: set it
      # once every main/webhook runs ≥ 2.34, which the version lock guarantees).
      N8N_WEBHOOK_RESPONSE_RELAY_OFFLOAD_ENABLED: "true"
      N8N_WEBHOOK_RESPONSE_RELAY_SIZE_MAX: "64"
      N8N_EVENTBUS_LOGWRITER_LOGBASENAME: eventlog-n8n-webhook-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      # ≈ 36 s observed; no migrations to run (main did them), hence shorter than main.
      start_period: 90s
    depends_on:
      # "main healthy" = DB migrated by exactly one process; any instance type WOULD run migrations on an empty DB (verified).
      n8n-main:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_WEBHOOK:-512m}

  n8n-webhook-2:
    <<: *n8n-base
    command: ["webhook"]
    networks:
      - proxy
      - internal
    environment:
      <<: *n8n-env
      N8N_WEBHOOK_RESPONSE_RELAY_OFFLOAD_ENABLED: "true"
      N8N_WEBHOOK_RESPONSE_RELAY_SIZE_MAX: "64"
      N8N_EVENTBUS_LOGWRITER_LOGBASENAME: eventlog-n8n-webhook-2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      n8n-main:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_WEBHOOK:-512m}

  # ======================================================================================================================================
  # n8n-worker-1/2 + their runners sidecars. WORKER_REPLICAS>2 adds worker-3..N via render.sh (compose.scale.yml), copied from worker-1.
  # ======================================================================================================================================
  n8n-worker-1:
    <<: *n8n-base
    # --concurrency = parallel jobs per worker (n8n default 10; N8N_CONCURRENCY_PRODUCTION_LIMIT ≠ -1 overrides it).
    command: ["worker", "--concurrency=${WORKER_CONCURRENCY:-10}"]
    # proxy = outbound Internet for HTTP Request / API nodes (internal alone has no route out); nothing is published.
    networks:
      - proxy
      - internal
    environment:
      <<: *n8n-env
      # REQUIRED for /healthz(/readiness) on a worker: N8N_METRICS alone starts the worker server with /metrics but WITHOUT health routes.
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      # Bull job-lock tuning (n8n defaults, made explicit): a job is considered stalled when its lock (60 s, renewed every 10 s) lapses;
      # the stalled-check runs every 30 s. QUEUE_WORKER_MAX_STALLED_COUNT was REMOVED in 2.x and is deliberately absent.
      QUEUE_WORKER_LOCK_DURATION: "60000"
      QUEUE_WORKER_LOCK_RENEW_TIME: "10000"
      QUEUE_WORKER_STALLED_INTERVAL: "30000"
      # Response relay — this is where the flag takes effect (the worker stores oversize webhook responses for main to stream); see the
      # webhook services for the matching values. Requires a storing binary mode (database, set above).
      N8N_WEBHOOK_RESPONSE_RELAY_OFFLOAD_ENABLED: "true"
      N8N_WEBHOOK_RESPONSE_RELAY_SIZE_MAX: "64"
      N8N_EVENTBUS_LOGWRITER_LOGBASENAME: eventlog-n8n-worker-1
    healthcheck:
      # worker readiness additionally requires a LIVE Redis connection (verified) — a worker cut off from Valkey turns unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      n8n-main:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_WORKER:-1g}

  n8n-worker-1-runners:
    <<: *runners-base
    environment:
      <<: *runners-env
      # the task broker of ITS worker (port 5679, service DNS name). The launcher retries every 5 s until the broker is up, so the
      # depends_on below only avoids 30-60 s of connection noise in the logs.
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-1:5679
    depends_on:
      n8n-worker-1:
        condition: service_healthy

  n8n-worker-2:
    <<: *n8n-base
    command: ["worker", "--concurrency=${WORKER_CONCURRENCY:-10}"]
    networks:
      - proxy
      - internal
    environment:
      <<: *n8n-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      QUEUE_WORKER_LOCK_DURATION: "60000"
      QUEUE_WORKER_LOCK_RENEW_TIME: "10000"
      QUEUE_WORKER_STALLED_INTERVAL: "30000"
      N8N_WEBHOOK_RESPONSE_RELAY_OFFLOAD_ENABLED: "true"
      N8N_WEBHOOK_RESPONSE_RELAY_SIZE_MAX: "64"
      N8N_EVENTBUS_LOGWRITER_LOGBASENAME: eventlog-n8n-worker-2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      n8n-main:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_WORKER:-1g}

  n8n-worker-2-runners:
    <<: *runners-base
    environment:
      <<: *runners-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-2:5679
    depends_on:
      n8n-worker-2:
        condition: service_healthy

  # ======================================================================================================================================
  # backup — nightly encrypted backups to every BACKUP_REMOTES target + weekly restore test (compose/backup/, S5)
  # ======================================================================================================================================
  backup:
    # built locally from the SAME Postgres image as the database (pg_dump/pg_restore always match the server)
    image: n8nkit/backup:local
    build:
      context: ./backup
      args:
        BASE_IMAGE: ${POSTGRES_IMAGE}:${POSTGRES_VERSION}@${POSTGRES_DIGEST:?run make pin}
    # uid 70 = postgres: the restore test runs a scratch Postgres, which refuses root. scripts/backup-perms.sh (run by
    # `make up`) makes secrets/age-key.txt and backups/ usable by this uid without locking the operator out.
    user: "70:70"
    read_only: true
    tmpfs:
      # dumps, encrypted bundles and the restore-test scratch cluster are built here; size it to ~2x the database.
      # tmpfs pages count against the memory limit below: MEM_LIMIT_BACKUP >= BACKUP_TMPFS_SIZE + 256m (preflight checks)
      - /tmp:size=${BACKUP_TMPFS_SIZE:-1g}
    restart: unless-stopped
    # supercronic waits for a running backup on SIGTERM; give a large pg_dump time to finish
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: n8n
      PGDATABASE: n8n
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (make init)}
      # written into every bundle: a restored database is useless without the key that encrypted its credentials
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY (make init)}
      N8N_VERSION: ${N8N_VERSION}
      DOMAIN: ${DOMAIN:?set DOMAIN}
      # cert-check.sh (hourly): the certificate Caddy serves for DOMAIN on caddy:HTTPS_PORT -> cert_expiry_timestamp_seconds
      TLS_MODE: ${TLS_MODE:-acme}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      TZ: ${GENERIC_TIMEZONE:-Asia/Ho_Chi_Minh}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_REMOTES: ${BACKUP_REMOTES:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      RESTORE_TEST_SCHEDULE: ${RESTORE_TEST_SCHEDULE:-0 3 * * 0}
      BACKUP_RETENTION_DAILY_DAYS: ${BACKUP_RETENTION_DAILY_DAYS:-30}
      BACKUP_RETENTION_MONTHLY_DAYS: ${BACKUP_RETENTION_MONTHLY_DAYS:-365}
      BACKUP_RETENTION_MIN_KEEP: ${BACKUP_RETENTION_MIN_KEEP:-7}
      BACKUP_NOTIFY_SUCCESS: ${BACKUP_NOTIFY_SUCCESS:-false}
      BACKUP_ALLOW_SINGLE_RECIPIENT: ${BACKUP_ALLOW_SINGLE_RECIPIENT:-false}
      RESTORE_TEST_MAX_AGE_HOURS: ${RESTORE_TEST_MAX_AGE_HOURS:-26}
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_AGE_RECOVERY_PUBLIC_KEY: ${BACKUP_AGE_RECOVERY_PUBLIC_KEY:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      # rclone remotes "r2:" and "s3:" (BACKUP_REMOTES="r2:bucket/path s3:bucket/path"); any other rclone remote can be
      # added in a compose.override.yml with its RCLONE_CONFIG_<NAME>_* variables.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACL: private
      # a bucket-scoped R2 token may not list or create buckets
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: AWS
      RCLONE_CONFIG_S3_REGION: ${RCLONE_CONFIG_S3_REGION:-ap-southeast-1}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${RCLONE_CONFIG_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_S3_ACL: private
      RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
    volumes:
      # metrics + restore-test report (survive restarts; node-exporter reads metrics.prom in S6)
      - backup_state:/state
      # a fetched, decrypted bundle waiting to be restored (make restore), emptied on every exit of make restore
      - backup_work:/work
      - ./secrets/age-key.txt:/run/secrets/age-key.txt:ro,z
      # BACKUP_REMOTES path "/backups/local" = compose/backups on the host; "/backups/external" = BACKUP_LOCAL_PATH
      # (an external disk / NAS mount; defaults to the same directory when unset)
      - ./backups:/backups/local:z
      - ${BACKUP_LOCAL_PATH:-./backups}:/backups/external:z
    # proxy = egress for R2/S3/Telegram; internal = postgres
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_BACKUP:-1536m}

  # ======================================================================================================================================
  # Monitoring profile (S6): COMPOSE_PROFILES=monitoring (+ ,kuma together with KUMA_ENABLED=on). Prometheus scrapes, Grafana shows and
  # alerts (Telegram), Loki stores the stack's logs, Alloy ships them, node-exporter + cAdvisor describe the host and the containers.
  # Network rule: the n8n workers execute user workflows that can make HTTP requests to anything on their networks, so Loki (all logs),
  # Alloy and the exporters live ONLY on the `monitoring` network; Prometheus also joins `internal` to scrape n8n and Caddy, Grafana
  # sits on `proxy` (behind Caddy at /grafana/, with its own login).
  # ======================================================================================================================================
  prometheus:
    image: ${PROMETHEUS_IMAGE}:${PROMETHEUS_VERSION}@${PROMETHEUS_DIGEST:?run make pin}
    profiles: ["monitoring"]
    restart: unless-stopped
    # the image runs as nobody (65534) and owns /prometheus, which a new named volume inherits
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}
      - --web.listen-address=:9090
    volumes:
      - prometheus_data:/prometheus
      # prometheus.yml + targets/n8n.json (written by render.sh; file_sd re-reads it)
      - ./monitoring/prometheus:/etc/prometheus:ro,z
    networks:
      - internal
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_PROMETHEUS:-512m}

  grafana:
    image: ${GRAFANA_IMAGE}:${GRAFANA_VERSION}@${GRAFANA_DIGEST:?run make pin}
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # served by Caddy under /grafana/ of the n8n domain (PUBLIC_URL always ends with "/")
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:?set PUBLIC_URL (make init)}grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # applied when Grafana creates its database (first start); to change it later: grafana cli admin reset-admin-password
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD (make init)}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # no phoning home and no plugin downloads at start (nothing here needs a plugin)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Grafana is served from the n8n origin (/grafana/): a plugin installed from the catalogue would run its scripts there,
      # next to n8n's session cookie — no catalogue installs, no external snapshots, no public dashboards
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      # Memory (measured 2026-10-09 in throwaway Grafanas; live, Grafana sat at its 768 MiB limit and swapped): Grafana
      # gzips every response itself with ~5 MiB of buffers each, which ballooned the heap to 0.8-1.1 GiB while dashboards
      # loaded (OOM-killed at 1 GiB). Caddy's `encode zstd gzip` compresses instead. GOMEMLIMIT keeps the Go GC target
      # below the container limit (about half of MEM_LIMIT_GRAFANA), and the 11 bundled data-source plugins the kit does
      # not use stop running as separate processes. All three together: peak 400 MiB under the worst load at 768m.
      GF_SERVER_ENABLE_GZIP: "false"
      GOMEMLIMIT: ${GRAFANA_GOMEMLIMIT:-400MiB}
      # (a trailing backslash inside double quotes joins the lines without a space)
      GF_PLUGINS_DISABLE_PLUGINS: "elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,\
        jaeger,mssql,mysql,opentsdb,stackdriver,tempo,zipkin"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # encrypts the secrets Grafana stores (the Telegram token of the contact point). make init generates one for new
      # installs; the fallback is Grafana's built-in default, so an older .env keeps decrypting what it already stored
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-SW2YcwTIb9zpOOhoPsMm}
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      # referenced by the contact point in alerting/notifications.yml (render.sh); smoke 09 proves Grafana expanded them
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro,z
    # edge-grafana: Caddy -> grafana:3000 and egress to Telegram (NOT proxy: the workers must not reach Grafana directly, past
    # Caddy's /grafana/metrics block and UI_PROTECT); monitoring: Prometheus + Loki
    networks:
      - edge-grafana
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # the FIRST start runs ~700 database migrations and provisions the alert rules before the HTTP port opens: ~40 s on a
      # CI runner, ~10 min on the 4-vCPU build VM while it was saturated (2026-10-09); later starts take seconds
      start_period: 300s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_GRAFANA:-768m}

  loki:
    image: ${LOKI_IMAGE}:${LOKI_VERSION}@${LOKI_DIGEST:?run make pin}
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-336h}
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro,z
    networks:
      - monitoring
    # No container healthcheck: the image has no shell tools (no wget/curl; verified in CI 2026-10-08). Prometheus scrapes
    # loki:3100 and the MonitoringTargetDown alert fires when it is down.
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_LOKI:-512m}

  alloy:
    image: ${ALLOY_IMAGE}:${ALLOY_VERSION}@${ALLOY_DIGEST:?run make pin}
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # root for the Docker socket (root:docker 0660; the image's own user "alloy" can neither read it nor write the new data volume —
    # verified in CI 2026-10-08). The socket is root-equivalent even mounted read-only; Alloy only reads the container logs of THIS
    # project (config.alloy filters on the compose label). label:disable: SELinux would deny the socket otherwise.
    # Paths outside /var/lib/alloy and /etc/alloy (owned by the image user): root with cap_drop ALL has no CAP_DAC_OVERRIDE, so it
    # cannot enter them ("mkdir /var/lib/alloy/data: permission denied", CI 2026-10-08).
    user: "0:0"
    security_opt:
      - no-new-privileges:true
      - label:disable
    cap_drop:
      - ALL
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/alloy-data
      - --disable-reporting
      - /config.alloy
    environment:
      KIT_PROJECT: ${COMPOSE_PROJECT_NAME:-n8nkit}
    volumes:
      # read positions survive restarts (no duplicated or lost log lines)
      - alloy_data:/alloy-data
      - ./monitoring/alloy/config.alloy:/config.alloy:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    # Loki has no healthcheck (see above); loki.write retries with backoff until Loki is ready
    depends_on:
      loki:
        condition: service_started
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_ALLOY:-384m}

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}:${NODE_EXPORTER_VERSION}@${NODE_EXPORTER_DIGEST:?run make pin}
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    pid: host
    security_opt:
      - no-new-privileges:true
      - label:disable
    cap_drop:
      - ALL
    command:
      - --path.rootfs=/host
      # the backup sidecar's metrics (backup_*, restore_test_*, cert_*): /state/metrics.prom of the backup_state volume
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($|/)
    volumes:
      # never :z on / (it would relabel the whole host); rslave so mounts made later (a USB disk) are seen too
      - /:/host:ro,rslave
      - backup_state:/textfile:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_NODE_EXPORTER:-128m}

  cadvisor:
    image: ${CADVISOR_IMAGE}:${CADVISOR_VERSION}@${CADVISOR_DIGEST:?run make pin}
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - label:disable
    cap_drop:
      - ALL
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # only the two compose labels become metric labels (all labels would multiply the series)
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      # disk + diskIO OFF: per-container filesystem usage walks every container's layers each cycle — on the build VM (40
      # containers) that alone was 60 % CPU and pushed the load to 44; off = 0.5 % CPU, 25 MiB (2026-10-09). No panel uses them.
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_CADVISOR:-256m}

  # Uptime Kuma: the outside view (https://DOMAIN/healthz …) on kuma.DOMAIN. Profile "kuma" goes into COMPOSE_PROFILES together with
  # KUMA_ENABLED=on (preflight checks that the two agree). Monitors + notifications are set up in its UI (docs/operations/monitoring.md).
  uptime-kuma:
    image: ${KUMA_IMAGE}:${KUMA_VERSION}@${KUMA_DIGEST:?run make pin}
    profiles: ["kuma"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # skip Kuma 2's "choose a database" first-run page; make up then creates the admin account itself
      # (scripts/kuma-setup.sh, KUMA_ADMIN_USER / KUMA_ADMIN_PASSWORD from .env), so the setup page is never left open
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - kuma_data:/app/data
    # edge-kuma: Caddy reaches it as uptime-kuma:3001, and egress for its checks and notifications. Not proxy: the workers
    # must not reach it.
    networks:
      - edge-kuma
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT_KUMA:-384m}

networks:
  # backend network: every service; `internal: true` = no route to the outside world (see the header). postgres, valkey and the runners
  # sidecars live ONLY here.
  internal:
    internal: true
  # routable network: caddy (edge) + main, webhook pool and workers (outbound HTTP for nodes). Nothing here publishes a port except caddy.
  proxy: {}
  # monitoring profile only: Prometheus, Grafana, Loki, Alloy, node-exporter, cAdvisor — NOT reachable from the n8n workers (whose
  # workflows can call any address on their networks), because Loki holds every log line and nothing here needs a login.
  monitoring:
    internal: true
  # Caddy <-> Grafana and Caddy <-> Uptime Kuma, one link each (routable: Telegram and Kuma's checks need egress)
  edge-grafana: {}
  edge-kuma: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  pg_data: {}
  valkey_data: {}
  n8n_data: {}
  n8n_files: {}
  backup_state: {}
  backup_work: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  alloy_data: {}
  kuma_data: {}
