name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install linters (yamllint from apt; shellcheck + hadolint pinned releases, sha256-checked)
        env:
          # shellcheck is pinned to the version used on the build hosts: apt's older build reports different
          # codes (e.g. SC2317 vs SC2329 for trap-only functions) and would make CI and local lint disagree.
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint xz-utils
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          sudo install -m 755 /tmp/hadolint /usr/local/bin/hadolint
          shellcheck --version | sed -n 2p; yamllint --version; hadolint --version

      - name: make lint
        run: make lint

  # The real thing on a fresh runner: make init -> make up -> make smoke (twice: the suite must be idempotent),
  # with the internal CA on the default ports 80/443 — the closest a CI runner gets to a fresh VPS.
  smoke:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bring the stack up (init, up, doctor)
        run: tests/ci/up.sh

      - name: make smoke
        run: make -C compose smoke

      - name: make smoke again (idempotency, reused owner + API key)
        run: make -C compose smoke

      # TC-012 for real: replace the live database with the newest backup, then prove the stack still routes and
      # executes (owner + API key come back from the restored database).
      - name: make restore BACKUP=latest, then smoke 04+05 against the restored database
        run: |
          make -C compose restore BACKUP=latest YES=1
          make -C compose smoke ONLY=01,04,05

      - name: Collect logs
        if: failure()
        run: tests/ci/collect-logs.sh artifacts

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs
          path: artifacts/
          retention-days: 7
