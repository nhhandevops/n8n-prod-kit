version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["ci", "dependencies"]

# Container images are NOT managed here: every image (including the backup sidecar's base, which compose passes in
# as a build argument) is pinned by digest in compose/versions.env and moved with `make pin`. The weekly
# weekly-latest-n8n workflow is the early warning for n8n itself.
